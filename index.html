<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Obra Missionária — Ala Palmas 4</title>
<meta name="description" content="Ferramentas para o líder de missão da ala: relatório de progresso, calendário de almoço, disponibilidade para lições e acompanhamento no caminho do convênio.">
<meta name="theme-color" content="#f2ece0">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/css/app.css">
<script>
  // Antes da primeira pintura, para não piscar branco no tema escuro.
  (() => {
    const t = localStorage.getItem('om_tema')
           || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.dataset.theme = t;
    const f = Number(localStorage.getItem('om_fonte'));
    if (f) document.documentElement.style.setProperty('--fs', f + 'px');
  })();
</script>
</head>
<body>

<a class="sr-only" href="#conteudo">Pular para o conteúdo</a>

<header class="hdr">
  <svg class="hdr__temple" width="60" height="46" viewBox="0 0 120 92" fill="none"
       stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
       aria-hidden="true" focusable="false">
    <!-- pináculo central -->
    <path d="M60 4v8"/>
    <path d="M52 30V20l8-8 8 8v10"/>
    <!-- pináculos laterais internos -->
    <path d="M38 34V24l6-7 6 7v10"/>
    <path d="M70 34V24l6-7 6 7v10"/>
    <!-- pináculos externos -->
    <path d="M24 40V31l5-6 5 6v9"/>
    <path d="M86 40V31l5-6 5 6v9"/>
    <!-- corpo -->
    <path d="M22 40h76v30H22z"/>
    <!-- janelas em arco -->
    <path d="M36 70V56a5 5 0 0 1 10 0v14"/>
    <path d="M55 70V56a5 5 0 0 1 10 0v14"/>
    <path d="M74 70V56a5 5 0 0 1 10 0v14"/>
    <!-- base e degraus -->
    <path d="M16 70h88M10 78h100M4 86h112"/>
  </svg>

  <p class="hdr__church">Igreja de Jesus Cristo dos Santos dos Últimos Dias</p>
  <!-- Espelha ALA.titulo em js/config.js: estático aqui só para a primeira pintura. -->
  <h1 class="hdr__title">Obra Missionária da Ala Palmas 4</h1>
  <p class="hdr__sub">Ferramentas para o LMA</p>

  <button class="hdr__role" id="btn-papel" type="button">
    <span id="papel-icone">👥</span><span id="papel-texto">Membro</span>
  </button>

  <div class="hdr__tools">
    <button class="hdr__btn" id="btn-tema" type="button"></button>
    <button class="hdr__btn" id="btn-fonte-menos" type="button" aria-label="Diminuir a letra">A-</button>
    <button class="hdr__btn" id="btn-fonte-mais" type="button" aria-label="Aumentar a letra">A+</button>
  </div>
</header>

<nav class="nav" id="nav" aria-label="Módulos"></nav>

<main class="main" id="conteudo" tabindex="-1"></main>

<noscript>
  <div class="main">
    <div class="card"><div class="card__body">
      Este aplicativo precisa de JavaScript ativado para funcionar.
    </div></div>
  </div>
</noscript>

<script type="module" src="/js/app.js"></script>
</body>
</html>
