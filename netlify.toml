[build]
  publish = "."
  # Gera js/supabase-config.js a partir das variáveis de ambiente. O arquivo
  # não é versionado porque o repositório é público. Sem as variáveis o build
  # falha de propósito — publicar sem credenciais faria o app cair no
  # localStorage e fingir que sincroniza.
  command = "node scripts/gerar-config.cjs"
  ignore = "exit 1"

# Cabeçalhos gerais. O app tem dados pessoais da ala: fora do índice dos
# buscadores e sem referrer para fora.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), interest-cohort=()"
    # Sem CDN de terceiro: o cliente Supabase é servido de js/vendor/.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'none'"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Sem hash no nome dos arquivos, então o service worker é quem guarda offline.
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Biblioteca de terceiro, só muda quando atualizamos a versão de propósito.
[[headers]]
  for = "/js/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Só as rotas desconhecidas caem no index; arquivos existentes são servidos
# normalmente, então os módulos ES continuam funcionando.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
